blueprint:
  name: Sterowanie piecem (suma logiczna stref)
  description: >-
    Włącza piec gazowy tylko wtedy, gdy któryś kaloryfer w domu faktycznie chce
    grzać (suma logiczna wszystkich głowic / stref).


    • Zapotrzebowanie: otwarcie zaworu (np. sensor *_pi_heating_demand z
    Zigbee2MQTT) powyżej progu na dowolnej głowicy, lub opcjonalnie
    hvac_action = heating na dowolnym termostacie.

    • Ochrona przed taktowaniem: opóźnienie włączenia i wyłączenia, minimalny
    czas pracy i minimalna przerwa pieca.

    • Opcjonalny wyłącznik sezonu grzewczego: gdy jest wyłączony, piec nie
    włączy się wcale.


    Jeśli wszystkie czujniki są niedostępne, zapotrzebowanie = brak, więc piec
    się wyłączy (bezpieczny stan).
  domain: automation
  author: Mikołaj
  source_url: https://github.com/mikandrzej/ha-blueprints/blob/main/blueprints/automation/mikolaj/kotlownia_piec.yaml
  homeassistant:
    min_version: 2024.10.0
  input:
    boiler:
      name: Piec
      description: >-
        Przekaźnik pieca (switch). Do testów możesz wskazać input_boolean,
        np. input_boolean.kotlownia_piec_test.
      selector:
        entity:
          filter:
            - domain:
                - switch
                - input_boolean
    demand_section:
      name: Zapotrzebowanie na ciepło
      icon: mdi:radiator
      collapsed: false
      input:
        valve_sensors:
          name: Otwarcie zaworów
          description: >-
            Sensory otwarcia zaworu w % ze wszystkich głowic w domu (np.
            sensor.salon_jadalnia_kaloryfer_pi_heating_demand).
          default: []
          selector:
            entity:
              multiple: true
              filter:
                - domain: sensor
        valve_threshold:
          name: Próg otwarcia zaworu
          description: Zawór otwarty co najmniej tyle = głowica chce grzać.
          default: 10
          selector:
            number:
              min: 1
              max: 100
              step: 1
              unit_of_measurement: "%"
              mode: slider
        heating_climates:
          name: Termostaty (dodatkowy sygnał)
          description: >-
            Opcjonalnie: termostaty, których hvac_action = heating też liczy
            się jako zapotrzebowanie (np. running_state głowic albo termostaty
            Better Thermostat).
          default: []
          selector:
            entity:
              multiple: true
              filter:
                - domain: climate
        min_valid_temp:
          name: Minimalna wiarygodna temperatura głowicy
          description: >-
            Termostat z dodatkowego sygnału liczy się jako zapotrzebowanie tylko,
            gdy jego temperatura jest co najmniej taka (odrzuca błędne odczyty
            typu 0 °C) i jest niższa od jego temperatury zadanej (+0,5 °C).
            Odrzucone głowice są wypisywane w opisie stanu.
          default: 3
          selector:
            number:
              min: -10
              max: 15
              step: 0.5
              unit_of_measurement: °C
              mode: box
        stale_minutes:
          name: Głowica nie odpowiada po
          description: >-
            Termostat, który nie zgłosił się (żaden raport stanu) od tylu minut,
            nie wymusza pracy pieca. Niedostępne termostaty są pomijane zawsze.
          default: 60
          selector:
            number:
              min: 5
              max: 720
              step: 5
              unit_of_measurement: min
              mode: box
        season_switches:
          name: Wyłącznik sezonu grzewczego
          description: >-
            Opcjonalnie: input_boolean / switch. Gdy którykolwiek jest
            wyłączony, piec nie grzeje.
          default: []
          selector:
            entity:
              multiple: true
              filter:
                - domain:
                    - input_boolean
                    - switch
    timing_section:
      name: Czasy (ochrona przed taktowaniem)
      icon: mdi:timer-outline
      collapsed: true
      input:
        on_delay:
          name: Opóźnienie włączenia
          description: Jak długo zapotrzebowanie musi trwać, zanim piec ruszy.
          default: 120
          selector:
            number:
              min: 0
              max: 1800
              step: 10
              unit_of_measurement: s
              mode: box
        off_delay:
          name: Opóźnienie wyłączenia
          description: Jak długo musi nie być zapotrzebowania, zanim piec stanie.
          default: 180
          selector:
            number:
              min: 0
              max: 1800
              step: 10
              unit_of_measurement: s
              mode: box
        min_run:
          name: Minimalny czas pracy
          default: 10
          selector:
            number:
              min: 0
              max: 60
              step: 1
              unit_of_measurement: min
              mode: box
        min_off:
          name: Minimalna przerwa
          default: 5
          selector:
            number:
              min: 0
              max: 60
              step: 1
              unit_of_measurement: min
              mode: box
    status_section:
      name: Stan pracy pieca (do wyświetlenia na panelu)
      icon: mdi:information-outline
      collapsed: true
      input:
        status_text:
          name: Opis stanu (input_text)
          description: >-
            Opcjonalnie: input_text (maks. długość 255), do którego automatyzacja
            wpisuje, co robi piec i dlaczego, np. "Grzeje – zapotrzebowanie:
            Kuchnia, Salon".
          default: []
          selector:
            entity:
              multiple: true
              filter:
                - domain: input_text
        status_until:
          name: Koniec bieżącej fazy (input_datetime)
          description: >-
            Opcjonalnie: input_datetime (data i godzina) z momentem końca
            bieżącego oczekiwania (min. czas pracy, min. przerwa, opóźnienia).
            Gdy nic nie czeka, ma wartość z przeszłości. Z niego panel może
            policzyć "zostało X min".
          default: []
          selector:
            entity:
              multiple: true
              filter:
                - domain: input_datetime

# parallel: aktualizacje stanu nie przerywają oczekiwania na min. czas pracy /
# przerwy. Każda gałąź po odczekaniu ponownie sprawdza zapotrzebowanie.
mode: parallel
max: 25
max_exceeded: silent

trigger_variables:
  valves: !input valve_sensors
  threshold: !input valve_threshold
  climates: !input heating_climates
  min_valid: !input min_valid_temp
  stale_min: !input stale_minutes
  seasons: !input season_switches

triggers:
  - trigger: template
    id: demand_on
    value_template: >-
      {% set nc = namespace(c=0) %}{% for e in climates if is_state_attr(e, 'hvac_action', 'heating') and states[e] is not none and (now() - states[e].last_reported).total_seconds() < stale_min | float * 60 and state_attr(e, 'current_temperature') | float(-99) >= min_valid | float and state_attr(e, 'current_temperature') | float(99) < state_attr(e, 'temperature') | float(-99) + 0.5 %}{% set nc.c = nc.c + 1 %}{% endfor %}
      {{ (seasons | reject('is_state', 'on') | list | count == 0)
         and ((valves | map('states') | map('float', 0) | select('ge', threshold | float) | list | count > 0)
              or (nc.c > 0)) }}
    for:
      seconds: !input on_delay
  - trigger: template
    id: demand_off
    value_template: >-
      {% set nc = namespace(c=0) %}{% for e in climates if is_state_attr(e, 'hvac_action', 'heating') and states[e] is not none and (now() - states[e].last_reported).total_seconds() < stale_min | float * 60 and state_attr(e, 'current_temperature') | float(-99) >= min_valid | float and state_attr(e, 'current_temperature') | float(99) < state_attr(e, 'temperature') | float(-99) + 0.5 %}{% set nc.c = nc.c + 1 %}{% endfor %}
      {{ not ((seasons | reject('is_state', 'on') | list | count == 0)
         and ((valves | map('states') | map('float', 0) | select('ge', threshold | float) | list | count > 0)
              or (nc.c > 0))) }}
    for:
      seconds: !input off_delay
  - trigger: homeassistant
    id: start
    event: start
  # Aktualizacja opisu stanu (bez sterowania piecem).
  - trigger: state
    id: status
    entity_id: !input valve_sensors
  - trigger: state
    id: status
    entity_id: !input heating_climates
  - trigger: state
    id: status
    entity_id: !input season_switches
  - trigger: state
    id: status
    entity_id: !input boiler
  - trigger: time_pattern
    id: status
    minutes: "/1"

variables:
  boiler: !input boiler
  min_run: !input min_run
  min_off: !input min_off
  on_delay_s: !input on_delay
  off_delay_s: !input off_delay
  status_text: !input status_text
  status_until: !input status_until

actions:
  # --- Opis stanu ---------------------------------------------------------
  - variables:
      season_ok: "{{ seasons | reject('is_state', 'on') | list | count == 0 }}"
      demand_names: >-
        {% set ns = namespace(n=[]) %}
        {% for e in valves if states(e) | float(0) >= threshold | float %}
          {% set ns.n = ns.n + [area_name(e) or state_attr(e, 'friendly_name') or e] %}
        {% endfor %}
        {% for e in climates if is_state_attr(e, 'hvac_action', 'heating') and states[e] is not none and (now() - states[e].last_reported).total_seconds() < stale_min | float * 60 and state_attr(e, 'current_temperature') | float(-99) >= min_valid | float and state_attr(e, 'current_temperature') | float(99) < state_attr(e, 'temperature') | float(-99) + 0.5 %}
          {% set ns.n = ns.n + [area_name(e) or state_attr(e, 'friendly_name') or e] %}
        {% endfor %}
        {{ ns.n | unique | list }}
      ignored_names: >-
        {% set ns = namespace(n=[]) %}
        {% for e in climates if is_state_attr(e, 'hvac_action', 'heating') %}
          {% set name = area_name(e) or state_attr(e, 'friendly_name') or e %}
          {% set t = state_attr(e, 'current_temperature') | float(-99) %}
          {% if states[e] is none or (now() - states[e].last_reported).total_seconds() >= stale_min | float * 60 %}
            {% set ns.n = ns.n + [name ~ ' (brak odpowiedzi)'] %}
          {% elif t < min_valid | float %}
            {% set ns.n = ns.n + [name ~ ' (' ~ state_attr(e, 'current_temperature') ~ ' °C)'] %}
          {% elif t >= state_attr(e, 'temperature') | float(-99) + 0.5 %}
            {% set ns.n = ns.n + [name ~ ' (temperatura osiągnięta)'] %}
          {% endif %}
        {% endfor %}
        {{ ns.n | unique | list }}
      boiler_on: "{{ is_state(boiler, 'on') }}"
      boiler_age: >-
        {{ (now() - states[boiler].last_changed).total_seconds() if states[boiler] is not none else 999999 }}
      prev_text: "{{ states(status_text[0]) if status_text | count > 0 else '' }}"
      prev_until: >-
        {{ state_attr(status_until[0], 'timestamp') | float(0) if status_until | count > 0 else 0 }}
      status: >-
        {% set names = demand_names | join(', ') %}
        {% set demand = season_ok and demand_names | count > 0 %}
        {% set t = now().timestamp() %}
        {% set idle = prev_until if 0 < prev_until <= t else t %}
        {% if demand and boiler_on %}
          {% set txt = 'Grzeje – zapotrzebowanie: ' ~ names %}{% set until = idle %}
        {% elif demand %}
          {% if boiler_age < min_off | float * 60 %}
            {% set txt = 'Czeka – minimalna przerwa pieca (zapotrzebowanie: ' ~ names ~ ')' %}
            {% set until = t + min_off | float * 60 - boiler_age %}
          {% else %}
            {% set txt = 'Włącza się – potwierdzanie zapotrzebowania: ' ~ names %}
            {% set until = prev_until if prev_text.startswith('Włącza się') and prev_until > t
                           else t + on_delay_s | float %}
          {% endif %}
        {% elif boiler_on %}
          {% set why = 'sezon grzewczy wyłączony' if not season_ok else 'brak zapotrzebowania' %}
          {% if boiler_age < min_run | float * 60 %}
            {% set txt = 'Kończy cykl – minimalny czas pracy (' ~ why ~ ')' %}
            {% set until = t + min_run | float * 60 - boiler_age %}
          {% else %}
            {% set txt = 'Kończy cykl – opóźnienie wyłączenia (' ~ why ~ ')' %}
            {% set until = prev_until if prev_text.startswith('Kończy cykl – opóźnienie') and prev_until > t
                           else t + off_delay_s | float %}
          {% endif %}
        {% elif not season_ok %}
          {% set txt = 'Wyłączony – sezon grzewczy wyłączony' %}{% set until = idle %}
        {% else %}
          {% set txt = 'Wyłączony – brak zapotrzebowania' %}{% set until = idle %}
        {% endif %}
        {% if ignored_names | count > 0 %}
          {% set txt = txt ~ '. Pominięto głowice: ' ~ ignored_names | join(', ') %}
        {% endif %}
        {{ {'text': txt[:255], 'until': until | int} }}
  - if:
      - condition: template
        value_template: "{{ status_text | count > 0 and states(status_text[0]) != status.text }}"
    then:
      - action: input_text.set_value
        target:
          entity_id: "{{ status_text[0] }}"
        data:
          value: "{{ status.text }}"
  - if:
      - condition: template
        value_template: "{{ status_until | count > 0 and (prev_until | int) != (status.until | int) }}"
    then:
      - action: input_datetime.set_datetime
        target:
          entity_id: "{{ status_until[0] }}"
        data:
          timestamp: "{{ status.until }}"
  - condition: template
    value_template: "{{ trigger.id != 'status' }}"
  # --- Sterowanie piecem --------------------------------------------------
  - variables:
      demand_now: >-
        {% set nc = namespace(c=0) %}{% for e in climates if is_state_attr(e, 'hvac_action', 'heating') and states[e] is not none and (now() - states[e].last_reported).total_seconds() < stale_min | float * 60 and state_attr(e, 'current_temperature') | float(-99) >= min_valid | float and state_attr(e, 'current_temperature') | float(99) < state_attr(e, 'temperature') | float(-99) + 0.5 %}{% set nc.c = nc.c + 1 %}{% endfor %}
        {{ (seasons | reject('is_state', 'on') | list | count == 0)
           and ((valves | map('states') | map('float', 0) | select('ge', threshold | float) | list | count > 0)
                or (nc.c > 0)) }}
  - choose:
      # Włączenie: czekamy do końca minimalnej przerwy.
      - conditions:
          - condition: template
            value_template: "{{ demand_now and not is_state(boiler, 'on') }}"
        sequence:
          - if:
              - condition: template
                value_template: "{{ trigger.id != 'start' }}"
            then:
              - delay:
                  seconds: >-
                    {{ [0, (min_off | float * 60)
                        - (now() - states[boiler].last_changed).total_seconds()] | max | int }}
          - condition: template
            value_template: >-
              {% set nc = namespace(c=0) %}{% for e in climates if is_state_attr(e, 'hvac_action', 'heating') and states[e] is not none and (now() - states[e].last_reported).total_seconds() < stale_min | float * 60 and state_attr(e, 'current_temperature') | float(-99) >= min_valid | float and state_attr(e, 'current_temperature') | float(99) < state_attr(e, 'temperature') | float(-99) + 0.5 %}{% set nc.c = nc.c + 1 %}{% endfor %}
              {{ (seasons | reject('is_state', 'on') | list | count == 0)
                 and ((valves | map('states') | map('float', 0) | select('ge', threshold | float) | list | count > 0)
                      or (nc.c > 0)) }}
          - action: homeassistant.turn_on
            target:
              entity_id: "{{ boiler }}"
      # Wyłączenie: czekamy do końca minimalnego czasu pracy.
      - conditions:
          - condition: template
            value_template: "{{ not demand_now and is_state(boiler, 'on') }}"
        sequence:
          - if:
              - condition: template
                value_template: "{{ trigger.id != 'start' }}"
            then:
              - delay:
                  seconds: >-
                    {{ [0, (min_run | float * 60)
                        - (now() - states[boiler].last_changed).total_seconds()] | max | int }}
          - condition: template
            value_template: >-
              {% set nc = namespace(c=0) %}{% for e in climates if is_state_attr(e, 'hvac_action', 'heating') and states[e] is not none and (now() - states[e].last_reported).total_seconds() < stale_min | float * 60 and state_attr(e, 'current_temperature') | float(-99) >= min_valid | float and state_attr(e, 'current_temperature') | float(99) < state_attr(e, 'temperature') | float(-99) + 0.5 %}{% set nc.c = nc.c + 1 %}{% endfor %}
              {{ not ((seasons | reject('is_state', 'on') | list | count == 0)
                 and ((valves | map('states') | map('float', 0) | select('ge', threshold | float) | list | count > 0)
                      or (nc.c > 0))) }}
          - action: homeassistant.turn_off
            target:
              entity_id: "{{ boiler }}"
