# TrueNAS SCALE: Apps -> Discover Apps -> (⋮) Install via YAML -> wklej całość.
# Plik anenji2mqtt.py musi leżeć w HOST_DIR (np. /mnt/<pool>/apps/anenji2mqtt).
services:
  anenji2mqtt:
    image: python:3.12-slim
    container_name: anenji2mqtt
    restart: unless-stopped
    devices:
      # Najlepiej stała ścieżka: ls -l /dev/serial/by-id/
      - /dev/serial/by-id/usb-1a86_USB2.0-Ser_-if00-port0:/dev/ttyINV
    volumes:
      - /mnt/pool-raidz/apps/anenji2mqtt:/app:ro
    environment:
      MQTT_HOST: 10.22.2.20
      MQTT_PORT: "1883"
      MQTT_USER: "uzytkownik_mqtt"
      MQTT_PASS: "haslo_mqtt"
      INTERVAL: "10"
      PYTHONUNBUFFERED: "1"
    command: sh -c "pip install -q --no-cache-dir minimalmodbus 'paho-mqtt>=2' && python /app/anenji2mqtt.py"
